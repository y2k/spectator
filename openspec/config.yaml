schema: spec-driven

context: |
  Language: write proposals, designs and all other artifacts in Russian, except tasks and specs.
  Write tasks and spec files (openspec/specs/**, delta specs in changes/*/specs/**) in English.
  Keep technical terms, code identifiers, file paths, RFC 2119 keywords (SHALL/MUST) and scenario headers in English.

rules:
  specs:
    - Write specs in English only
  proposal:
    - Write in Russian
  design:
    - Write in Russian
  tasks:
    - Write in English

operations:
  apply:
    guidance:
      - Communicate and summarize in Russian
  archive:
    guidance:
      - Communicate and summarize in Russian
